apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-ingress
  namespace: student-web
spec:
  ingressClassName: traefik
  rules:
    - host: www.id-539.com
      http:
        paths:
          - path: /about
            pathType: Prefix
            backend:
              service: {name: app-about, port: {number: 80}}
          - path: /static
            pathType: Prefix
            backend:
              service: {name: app-about, port: {number: 80}}
          - path: /research
            pathType: Prefix
            backend:
              service: {name: app-research, port: {number: 80}}
          - path: /api
            pathType: Prefix
            backend:
              service: {name: app-api, port: {number: 80}}
    - host: admin.id-539.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: app-research, port: {number: 80}}
