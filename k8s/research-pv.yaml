apiVersion: v1
kind: PersistentVolume
metadata:
  name: research-data-539
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: student-web
    name: research-data
  hostPath:
    path: /var/lib/student-web-539/research
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k8s-worker1]
