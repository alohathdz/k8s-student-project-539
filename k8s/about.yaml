apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-about
  namespace: student-web
spec:
  replicas: 2
  selector:
    matchLabels: {app: app-about}
  template:
    metadata:
      labels: {app: app-about}
    spec:
      containers:
        - name: app-about
          image: alohathdz/app-about:v1
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-about
  namespace: student-web
spec:
  type: ClusterIP
  selector: {app: app-about}
  ports:
    - {port: 80, targetPort: 5000}
