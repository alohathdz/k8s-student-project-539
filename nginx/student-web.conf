upstream student_traefik {
    least_conn;
    server 192.168.29.11:30082 max_fails=3 fail_timeout=10s;
    server 192.168.29.12:30082 max_fails=3 fail_timeout=10s;
}
server {
    listen 80;
    server_name www.id-539.com admin.id-539.com;
    location / {
        proxy_pass http://student_traefik;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
